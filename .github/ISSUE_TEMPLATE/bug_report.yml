name: Bug report
description: Report a reproducible repository-check or product defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report only information that is safe to share publicly. Do not include credentials or private work-order data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include commands and sanitized sample inputs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant model/runtime version if applicable.
