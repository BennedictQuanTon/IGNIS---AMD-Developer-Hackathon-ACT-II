name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install checker dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository links
        run: python scripts/check_repository.py
      - name: Run repository-checker tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build
